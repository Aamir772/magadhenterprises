# AI tile visualization endpoint. Netlify matches serverless functions BEFORE
# redirects, and redirects are fallbacks, so the /* catch-all below does not
# shadow /api/tile-visualize.
[functions]
  directory = "netlify/functions"

[functions.tile-visualize]
  runtime = "nodejs20.x"

# The tile visualizer is a real page. These rules must stay ABOVE the catch-all
# below, because Netlify applies the first matching rule and would otherwise
# serve the homepage for /tile-visualizer.
[[redirects]]
  from = "/tile-visualizer"
  to = "/tile-visualizer.html"
  status = 200

[[redirects]]
  from = "/tile-visualizer/"
  to = "/tile-visualizer.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"